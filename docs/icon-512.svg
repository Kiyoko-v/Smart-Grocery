<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F2826" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Glowing accent circle -->
  <circle cx="256" cy="256" r="170" fill="#10B981" opacity="0.12" filter="url(#glow)"/>

  <!-- Modern Shopping Trolley -->
  <g fill="none" stroke="url(#cartGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trolley handle & basket frame -->
    <path d="M120 150h54l36 170h184l32-136H166" />
    <!-- Trolley grid lines -->
    <path d="M210 240h186" stroke-width="14" opacity="0.8" />
    <path d="M260 184v136" stroke-width="14" opacity="0.8" />
    <path d="M330 184v136" stroke-width="14" opacity="0.8" />
    <!-- Wheels -->
    <circle cx="220" cy="370" r="18" fill="#10B981" />
    <circle cx="380" cy="370" r="18" fill="#10B981" />
  </g>

  <!-- Safety Shield with Checkmark (Budget Safety Indicator) -->
  <g transform="translate(290, 80) scale(0.65)" filter="url(#glow)">
    <path d="M128 20L32 68v90c0 98 96 160 96 160s96-62 96-160V68L128 20z" fill="url(#shieldGrad)" stroke="#60A5FA" stroke-width="10"/>
    <path d="M80 160l36 36 68-72" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Student Cap Badge / Smart Indicator -->
  <circle cx="160" cy="110" r="28" fill="#F59E0B" filter="url(#glow)"/>
  <path d="M146 110l10 10 20-20" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
