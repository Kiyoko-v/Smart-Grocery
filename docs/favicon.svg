<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Crisp drop shadow so symbol is clearly visible on both light and dark browser tab backgrounds -->
    <filter id="cartShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Transparent background so the icon background seamlessly matches the browser tab background -->
  <g filter="url(#cartShadow)">
    <!-- Centered Shopping Cart in vibrant signature brand emerald green -->
    <path d="M13 16.5h7l4 20h24l3-15H21" fill="none" stroke="#10B981" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="27" cy="44" r="3.8" fill="#10B981" />
    <circle cx="45" cy="44" r="3.8" fill="#10B981" />
  </g>
</svg>