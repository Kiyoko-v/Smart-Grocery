<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glowCyan512" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blurOuter" />
      <feFlood flood-color="#e0f8fe" flood-opacity="0.95" result="lightColor" />
      <feComposite in="lightColor" in2="blurOuter" operator="in" result="outerGlow" />

      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blurInner" />
      <feFlood flood-color="#9ae1f5" flood-opacity="0.9" result="cyanColor" />
      <feComposite in="cyanColor" in2="blurInner" operator="in" result="innerGlow" />

      <feMerge>
        <feMergeNode in="outerGlow" />
        <feMergeNode in="innerGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="128" fill="#0b1222" stroke="#1e293b" stroke-width="8" />

  <g filter="url(#glowCyan512)">
    <path d="M112 140h58l34 152h172l26-116H184" fill="none" stroke="#9ae1f5" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="216" cy="348" r="28" fill="#9ae1f5" />
    <circle cx="352" cy="348" r="28" fill="#9ae1f5" />
  </g>
</svg>
