<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Lighter cyan/white glowing effect for #9ae1f5 shopping cart -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blurOuter" />
      <feFlood flood-color="#e0f8fe" flood-opacity="0.95" result="lightColor" />
      <feComposite in="lightColor" in2="blurOuter" operator="in" result="outerGlow" />

      <feGaussianBlur in="SourceGraphic" stdDeviation="1.0" result="blurInner" />
      <feFlood flood-color="#9ae1f5" flood-opacity="0.9" result="cyanColor" />
      <feComposite in="cyanColor" in2="blurInner" operator="in" result="innerGlow" />

      <feMerge>
        <feMergeNode in="outerGlow" />
        <feMergeNode in="innerGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark navy squircle container so the #9ae1f5 glow is intensely visible -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b1222" stroke="#1e293b" stroke-width="1.2" />

  <!-- Centered Shopping Cart in #9ae1f5 with lighter-color luminous glow -->
  <g filter="url(#glowCyan)">
    <path d="M14 17.5h7.2l4.2 19h21.6l3.2-14.5H23" fill="none" stroke="#9ae1f5" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="27" cy="43.5" r="3.6" fill="#9ae1f5" />
    <circle cx="44" cy="43.5" r="3.6" fill="#9ae1f5" />
  </g>
</svg>
